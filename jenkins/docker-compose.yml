# Jenkins en un contenedor (guia: "Jenkins en contenedores").
#
#   docker compose -f jenkins/docker-compose.yml up -d --build
#
# - Puerto 9090 y no 8080: la guia advierte que Jenkins y la aplicacion
#   chocan en el 8080. Solo escucha en 127.0.0.1 (este equipo).
# - /var/run/docker.sock: Jenkins usa el Docker del equipo para construir
#   y desplegar la aplicacion, y para las pruebas con Testcontainers.
# - group_add: el socket pertenece al grupo docker (GID 140 en este
#   equipo; se ve con "getent group docker"). Sin esto Jenkins recibe
#   "permission denied", el problema de permisos que menciona la guia.
# - host.docker.internal: desde el contenedor, "localhost" es el propio
#   Jenkins. Con este nombre alcanza el puerto 80 del equipo (etapa
#   Comprobacion) y los puertos que abre Testcontainers.
name: jenkins

services:
  jenkins:
    build: .
    image: inventario-jenkins:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:8080"
    group_add:
      - "${DOCKER_GID:-140}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins-home:
