# Nginx es la unica puerta de entrada a la aplicacion (puerto 80).
#
# - /api/...  se reenvia al contenedor del backend. Frontend y API salen
#   del mismo dominio, asi que el navegador no hace peticiones CORS.
# - Todo lo demas son archivos de Angular. Las rutas de Angular
#   (/productos, /reportes, ...) no existen como archivos: se responde
#   index.html y el router de Angular muestra la pantalla correcta.
# Protocolo original de la peticion. Detras de un tunel (Cloudflare) el
# navegador usa https aunque a Nginx le llegue http; el tunel lo avisa
# con X-Forwarded-Proto. Si no viene, se usa el de Nginx.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        # "backend" es el nombre del servicio en docker-compose.yml.
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se guarda en cache, para que un despliegue nuevo se
    # vea de inmediato. Los .js/.css llevan un hash en el nombre
    # (outputHashing) y si se pueden guardar mucho tiempo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
